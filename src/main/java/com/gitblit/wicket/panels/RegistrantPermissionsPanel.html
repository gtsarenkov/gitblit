<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"  
      xmlns:wicket="https://wicket.apache.org/dtds.data/wicket-7.xsd"
      xml:lang="en"  
      lang="en"> 

<body>
<wicket:panel>

	<form class="permission-filters" wicket:id="permissionToggleForm">
		<div class="btn-group" data-toggle="buttons-radio">
			<a class="btn btn-info" wicket:id="showMutable"><wicket:message key="gb.mutable"></wicket:message></a>
			<a class="btn btn-info" wicket:id="showSpecified"><wicket:message key="gb.specified"></wicket:message></a>
			<a class="btn btn-info" wicket:id="showEffective"><wicket:message key="gb.effective"></wicket:message></a>
		</div>
	</form>
	
	<div wicket:id="permissionRow">
		<div class="permission-row">
			<div class="permission-registrant"><span wicket:id="registrant"></span></div>
			<div class="permission-type"><span class="label" wicket:id="pType">[permission type]</span></div>
			<select wicket:id="permission"></select>
		</div>
	</div>

	<form class="well permission-add" wicket:id="addPermissionForm">
		<select wicket:id="registrant"></select>
		<select wicket:id="permission"></select>
		<input class="btn btn-success" type="submit" value="Add" wicket:message="value:gb.add" wicket:id="addPermissionButton"/>
	</form>

	<wicket:fragment wicket:id="repositoryRegistrant">
		<b><span class="repositorySwatch" wicket:id="repositorySwatch"></span></b> <span wicket:id="repositoryName"></span>
	</wicket:fragment>

	<wicket:fragment wicket:id="userRegistrant">
		<span wicket:id="userAvatar"></span> <span wicket:id="userName"></span>
	</wicket:fragment>

	<wicket:fragment wicket:id="teamRegistrant">
		<strong wicket:id="teamName"></strong>
	</wicket:fragment>
	
</wicket:panel>
</body>
</html>
